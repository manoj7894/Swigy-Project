
name: Node.js Docker Build and Deploy to Azure ACR

on:
  push:
    branches:
      - dev

  pull_request:
    branches:
      - dev

permissions:
  contents: read

jobs:

  # ==========================================
  # JOB 1: BUILD AND SECURITY SCANNING
  # ==========================================

  build:
    name: Build and Scan Docker Image
    runs-on: ubuntu-latest

    # Required to access environment-level variables
    environment:
      name: dev

    env:
      DOCKER_IMAGE_NAME: ${{ vars.DOCKER_IMAGE_NAME }}
      IMAGE_TAG: ${{ vars.IMAGE_TAG }}

    steps:

      # Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # Build application
      - name: Build application
        run: npm run build --if-present
        env:
          CI: "false"

      # Run tests
      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail

          TEST_SCRIPT=$(jq -r '.scripts.test // empty' package.json)

          if [[ -z "$TEST_SCRIPT" ]]; then
            echo "No test script found. Skipping tests."

          elif [[ "$TEST_SCRIPT" == *"no test specified"* ]]; then
            echo "Placeholder test script found. Skipping tests."

          else
            CI=true npm test -- --watchAll=false --passWithNoTests
          fi

      # Install Trivy
      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release

          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list

          sudo apt-get update
          sudo apt-get install -y trivy

      # Filesystem vulnerability scan
      - name: Trivy filesystem scan
        run: |
          trivy fs \
            --severity HIGH,CRITICAL \
            --format table \
            -o fs-report.txt \
            .

      # Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t "$DOCKER_IMAGE_NAME:$IMAGE_TAG" \
            .

      # Docker image vulnerability scan
      - name: Trivy image scan
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --format table \
            -o image-report.txt \
            "$DOCKER_IMAGE_NAME:$IMAGE_TAG"

      # Save Docker image
      - name: Save Docker image
        run: |
          docker save \
            -o image.tar \
            "$DOCKER_IMAGE_NAME:$IMAGE_TAG"

      # Upload filesystem scan report
      - name: Upload filesystem scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-filesystem-report
          path: fs-report.txt
          if-no-files-found: ignore
          retention-days: 5

      # Upload Docker image and scan report
      - name: Upload deployment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deployment-artifacts
          path: |
            image.tar
            image-report.txt
          if-no-files-found: error
          retention-days: 2


  # ==========================================
  # JOB 2: AUTHENTICATION AND PUSH TO ACR
  # ==========================================

  deploy:
    name: Push Docker Image to Azure ACR

    needs: build

    # Deploy only on push to dev branch.
    # Pull requests will not deploy.
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'

    runs-on: ubuntu-latest

    environment:
      name: dev

    permissions:
      contents: read
      id-token: write

    env:
      ACR_NAME: ${{ vars.ACR_NAME }}
      ACR_REPOSITORY: ${{ vars.ACR_REPOSITORY }}
      ACR_LOGIN_SERVER: ${{ vars.ACR_NAME }}.azurecr.io
      DOCKER_IMAGE_NAME: ${{ vars.DOCKER_IMAGE_NAME }}
      IMAGE_TAG: ${{ vars.IMAGE_TAG }}

    steps:

      # Validate ACR configuration
      - name: Validate ACR configuration
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$ACR_NAME" ]]; then
            echo "ACR_NAME variable is missing."
            exit 1
          fi

          if [[ -z "$ACR_REPOSITORY" ]]; then
            echo "ACR_REPOSITORY variable is missing."
            exit 1
          fi

          echo "ACR Name: $ACR_NAME"
          echo "ACR Repository: $ACR_REPOSITORY"
          echo "ACR Login Server: $ACR_LOGIN_SERVER"
          echo "Docker Image: $DOCKER_IMAGE_NAME:$IMAGE_TAG"

      # Download Docker image artifact
      - name: Download deployment artifacts
        uses: actions/download-artifact@v4
        with:
          name: deployment-artifacts
          path: ./artifacts

      # Azure OIDC authentication
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Verify Azure authentication
      - name: Verify Azure Account
        run: |
          az account show --output table

      # Login to Azure Container Registry
      - name: Login to Azure Container Registry
        run: |
          az acr login --name "$ACR_NAME"

      # Load Docker image artifact
      - name: Load Docker image
        run: |
          docker load -i artifacts/image.tar

          docker image inspect \
            "$DOCKER_IMAGE_NAME:$IMAGE_TAG"

      # Tag Docker image
      - name: Tag Docker image
        run: |
          docker tag \
            "$DOCKER_IMAGE_NAME:$IMAGE_TAG" \
            "$ACR_LOGIN_SERVER/$ACR_REPOSITORY:$IMAGE_TAG"


      # Push Docker image to ACR
      - name: Push Docker image to ACR
        run: |
          docker push \
            "$ACR_LOGIN_SERVER/$ACR_REPOSITORY:$IMAGE_TAG"


      # Verify pushed image
      - name: Verify ACR image
        run: |
          az acr repository show \
            --name "$ACR_NAME" \
            --image "$ACR_REPOSITORY:$IMAGE_TAG" \
            --output table

      # List available image tags
      - name: Verify ACR repository tags
        run: |
          az acr repository show-tags \
            --name "$ACR_NAME" \
            --repository "$ACR_REPOSITORY" \
            --output table

      # - name: Deploy latest image to Azure Container App
      #   run: |
      #     az containerapp update \
      #       --name frissly-dev-appservice \
      #       --resource-group frissly-infra-rg \
      #       --image $ACR_LOGIN_SERVER/$ACR_REPOSITORY:$IMAGE_TAG

      # Cleanup Docker images
      - name: Docker cleanup
        if: always()
        run: |
          docker system prune -af || true

      # Azure logout
      - name: Azure logout
        if: always()
        run: |
          az logout || true


      - name: Send email notification
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: "Approval Required: Deploy to production"
          body: |
            Hello Team,

            The Dev deployment for branch 'main' is complete.

            Please approve the production deployment:
            GitHub Actions: https://github.com/${{ github.repository }}/actions

            Status: ${{ job.status }}
            Commit: ${{ github.sha }}
            Branch: ${{ github.ref }}
          to: "manojvarmapotthutri@gmail.com"
          from: "sender@example.com"
