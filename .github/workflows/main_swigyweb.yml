
name: Node.js Docker Build and Deploy to Azure ACR

on:
  push:
    branches:
      - dev

  pull_request:
    branches:
      - dev

permissions:
  contents: read

jobs:

  # ==========================================
  # JOB 1: BUILD AND SECURITY SCANNING
  # ==========================================

  build:
    name: Build and Scan Docker Image
    runs-on: ubuntu-latest

    env:
      DOCKER_IMAGE_NAME: onroute-backend

    steps:

      # Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # Build application
      - name: Build application
        run: npm run build --if-present

      # Run tests and skip placeholder test scripts
      - name: Run tests
        shell: bash
        run: |
          TEST_SCRIPT=$(jq -r '.scripts.test // empty' package.json)

          if [[ -z "$TEST_SCRIPT" ]]; then
            echo "No test script found. Skipping tests."

          elif [[ "$TEST_SCRIPT" == *"Error: no test specified"* ]]; then
            echo "Placeholder test script found. Skipping tests."

          else
            npm test
          fi

      # Install Trivy
      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release

          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list

          sudo apt-get update
          sudo apt-get install -y trivy

      # Filesystem vulnerability scan
      - name: Trivy filesystem scan
        run: |
          trivy fs \
            --severity HIGH,CRITICAL \
            --format table \
            -o fs-report.txt \
            .

      # Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t $DOCKER_IMAGE_NAME:${{ github.sha }} \
            .

      # Docker image vulnerability scan
      - name: Trivy image scan
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --format table \
            -o image-report.txt \
            $DOCKER_IMAGE_NAME:${{ github.sha }}

      # Save Docker image
      - name: Save Docker image
        run: |
          docker save \
            -o image.tar \
            $DOCKER_IMAGE_NAME:${{ github.sha }}

      # Upload filesystem scan report
      - name: Upload filesystem scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-filesystem-report
          path: fs-report.txt
          if-no-files-found: ignore
          retention-days: 5

      # Upload Docker image and scan report
      - name: Upload deployment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deployment-artifacts
          path: |
            image.tar
            image-report.txt
          if-no-files-found: error
          retention-days: 2


  # ==========================================
  # JOB 2: AUTHENTICATION AND PUSH TO ACR
  # ==========================================

  deploy:
    name: Push Docker Image to Azure ACR

    needs: build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    environment:
      name: dev

    permissions:
      contents: read
      id-token: write

    env:
      ACR_NAME: ${{ vars.ACR_NAME }}
      ACR_REPOSITORY: ${{ vars.ACR_REPOSITORY }}
      ACR_LOGIN_SERVER: ${{ vars.ACR_NAME }}.azurecr.io
      DOCKER_IMAGE_NAME: onroute-backend
      IMAGE_TAG: ${{ github.sha }}

    steps:

      # Download Docker image artifact
      - name: Download deployment artifacts
        uses: actions/download-artifact@v4
        with:
          name: deployment-artifacts
          path: ./artifacts

      # Authenticate with Azure using OIDC
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Verify Azure authentication
      - name: Verify Azure Account
        run: |
          az account show --output table

      # Login to Azure Container Registry
      - name: Login to Azure Container Registry
        run: |
          az acr login --name "$ACR_NAME"

      # Load Docker image artifact
      - name: Load Docker image
        run: |
          docker load -i artifacts/image.tar

      # Tag Docker image
      - name: Tag Docker image
        run: |
          docker tag \
            "$DOCKER_IMAGE_NAME:$IMAGE_TAG" \
            "$ACR_LOGIN_SERVER/$ACR_REPOSITORY:$IMAGE_TAG"

          docker tag \
            "$DOCKER_IMAGE_NAME:$IMAGE_TAG" \
            "$ACR_LOGIN_SERVER/$ACR_REPOSITORY:dev"

      # Push image to Azure Container Registry
      - name: Push Docker image to ACR
        run: |
          docker push \
            "$ACR_LOGIN_SERVER/$ACR_REPOSITORY:$IMAGE_TAG"

          docker push \
            "$ACR_LOGIN_SERVER/$ACR_REPOSITORY:dev"

      # Verify pushed Docker image
      - name: Verify ACR image
        run: |
          az acr repository show \
            --name "$ACR_NAME" \
            --image "$ACR_REPOSITORY:$IMAGE_TAG"

      # List available image tags
      - name: Verify ACR repository tags
        run: |
          az acr repository show-tags \
            --name "$ACR_NAME" \
            --repository "$ACR_REPOSITORY" \
            --output table

      # Cleanup Docker images
      - name: Docker cleanup
        if: always()
        run: |
          docker system prune -af || true

      # Azure logout
      - name: Azure logout
        if: always()
        run: |
          az logout || true
